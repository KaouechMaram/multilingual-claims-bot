<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STB Bank — Chatbot Réclamations Monétique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="page">
  <div class="auth-card">

    <!-- Panneau gauche : illustration de marque -->
    <aside class="brand-panel">
      <img src="assets/brand-panel.png" alt="STB Bank — Assistant intelligent pour vos réclamations monétiques" />
    </aside>

    <!-- Panneau droit : formulaire d'authentification -->
    <main class="form-panel">
      <div class="form-inner">

        <div class="form-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <svg class="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        </div>
        <h1>Chatbot Réclamations <span>Monétique</span></h1>
        <p class="subtitle">Connectez-vous pour accéder à votre espace</p>

        <form id="login-form" novalidate>

          <div class="field">
            <label for="username">Nom d'utilisateur</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Entrez votre nom d'utilisateur"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Entrez votre mot de passe"
                autocomplete="current-password"
                required
              />
              <button type="button" id="toggle-password" class="toggle-visibility" aria-label="Afficher le mot de passe">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="forgot-row">
            <a href="#" id="forgot-link">Mot de passe oublié ?</a>
          </div>

          <div id="form-message" class="form-message" role="alert" aria-live="polite"></div>

          <button type="submit" class="btn-primary" id="submit-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span id="submit-label">Se connecter</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>

          

        </form>
      </div>
    </main>

  </div>

  <footer class="trust-bar">
    <div class="trust-item">
      <span class="trust-icon trust-icon--green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <div>
        <strong>Sécurisé</strong>
        <p>Vos données sont protégées</p>
      </div>
    </div>
    <div class="trust-item">
      <span class="trust-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      </span>
      <div>
        <strong>Disponible 24H/24 – 7J/7</strong>
        <p>Un service à votre écoute en continu</p>
      </div>
    </div>
    <div class="trust-item">
      <span class="trust-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>
      <div>
        <strong>Rapide &amp; Efficace</strong>
        <p>Des réponses instantanées</p>
      </div>
    </div>
  </footer>
  <p class="copyright">© 2026 STB Bank – Tous droits réservés</p>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
